const KEY='inbeeld.redactiedossier.v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={page:0,f:{},tests:{}},cached=true;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.f&&old.tests)state=old;}catch{cached=false}
if(!Number.isInteger(state.page)||state.page<0||state.page>5)state.page=0;
const f=k=>state.f[k]??'';
const done=k=>String(f(k)).trim().length>0;
const num=i=>String(i).padStart(2,'0');
const data=k=>state.tests[k]||(state.tests[k]={draft:{},first:null,last:null,attempts:0,locked:false});
const normalize=v=>String(v??'').trim().toLocaleLowerCase('nl').replace(/[‐‑–—]/g,'-').replace(/[\s-]+/g,'');
function correct(id,q,value){return quizzes[id].mode==='gap'?normalize(q.a)===normalize(value):String(q.a)===String(value)}
function answer(id,q,value){if(value===undefined||value==='')return 'Nog niet ingevuld';return quizzes[id].mode==='gap'?value:q.opts[Number(value)]??'Nog niet ingevuld'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));cached=true}catch{cached=false}status()}
function status(){const el=$('#saveStatus');el.textContent=cached?'Werk bewaard in deze browser':'Opslag niet beschikbaar · bewaar je werk als pdf';el.className=cached?'status':'err'}
const openPlans=[['target','Doelgroep'],['format','TV-programma als inspiratiebron'],['place','Gemeente of streek en gekozen plek'],['purpose','Wat wil je bereiken bij je kijker?'],['facts','Welke informatie selecteer je? Vermeld je bron.'],['reason','Welke regiekeuze maak je voor je publiek? Gebruik een vakterm.']];
const logistics=[['shoot','Wanneer en waar film je? Wie helpt?'],['equipment','Wat controleer je voor en tijdens de opname?']];
const shootChecks=[['cut','Intro, kern en outro gemonteerd'],['review','Geluid, beeld en toegankelijkheid nagekeken'],['submit','Afgespeeld en ingediend via het afgesproken klasplatform'],['show','Getoond aan de klas en doelgroep en inspiratiebron toegelicht']];
const sceneNames=['Intro','Kern','Outro'];
function observed(i){return features.some((_,j)=>f('v'+i+'c'+j))||f('none'+i)}
function rubDone(){return rubric.every((_,i)=>done('rub'+i))&&done('improve')}
function groups(){return [
[['Opwarming',done('warm')&&done('warmChoice')]],
films.map((_,i)=>['Kijkkaart '+(i+1),observed(i)&&done('minus'+i)&&done('proof'+i)]),
['gap','match','regie'].map(k=>[quizzes[k].name,data(k).attempts>0]),
[[quizzes.read.name,data('read').attempts>0]],
[['Redactieplan',openPlans.every(([k])=>done(k))],['Draaiboek',sceneNames.every((_,i)=>['say','see'].every(p=>done(p+i)))],['Presentatietekst',done('script')],['Opname en toonmoment',logistics.every(([k])=>done(k))&&shootChecks.every(([k])=>f(k))]],
[['Zelfevaluatie',rubDone()],['Exit ticket',data('exit').attempts>0]]
]}
function metrics(){const gs=groups(),flat=gs.flat(),count=flat.filter(e=>e[1]).length,total=Object.keys(quizzes).reduce((n,k)=>n+(data(k).last?.score||0),0);return {gs,flat,count,total,pct:Math.round(100*count/flat.length)}}
function update(){const m=metrics();$('#pct').textContent=m.pct+'%';$('#prog').value=m.pct;$('#prog').title=m.count+' van '+m.flat.length+' afgerond';$('#score').textContent=m.total+' / 27';$('#nav').innerHTML=stages.map((x,i)=>'<button class="navitem" data-go="'+i+'" '+(i===state.page?'aria-current="step"':'')+'><span class="num">'+num(i+1)+'</span>'+x+(m.gs[i].every(v=>v[1])?'<span class="tick" aria-label="afgerond">✓</span>':'')+'</button>').join('');const wc=$('#wc');if(wc)wc.textContent=(f('script').trim().match(/\S+/g)||[]).length+' woorden';if($('#resultInner'))$('#resultInner').innerHTML=scoreTable();if($('#taskStatus'))$('#taskStatus').innerHTML=taskTable()}
function field(k,label,kind='textarea',rows=3){return '<label class="formfield">'+esc(label)+(kind==='textarea'?'<textarea rows="'+rows+'" data-f="'+k+'">'+esc(f(k))+'</textarea>':'<input type="text" data-f="'+k+'" value="'+esc(f(k))+'">')+'</label>'}
function selectF(k,label,opts){return '<label class="formfield">'+esc(label)+'<select data-f="'+k+'"><option value="">Kies een antwoord</option>'+opts.map(x=>'<option '+(f(k)===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'}
function checkbox(k,label){return '<label class="check"><input type="checkbox" data-f="'+k+'" '+(f(k)?'checked':'')+'>'+esc(label)+'</label>'}
function panel(x){return '<section class="panel">'+x+'</section>'}
function intro(i,title,desc,extra=''){return panel('<div class="kicker">Onderdeel '+num(i+1)+' / 06</div><h2>'+title+'</h2><p class="lead">'+desc+'</p>'+extra)}
function btn(action,txt,cl='secondary'){return '<button type="button" class="'+cl+'" data-act="'+action+'">'+txt+'</button>'}
function ext(url,name){return '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+name+' ↗</a>'}
function briefing(){return intro(0,'De briefing','Je maakt een tv-reportage die kijkers zin geeft om jouw gemeente of streek te bezoeken. Kies een plek die jij van dichtbij kent. Wat zou een bezoeker daar zonder jou over het hoofd zien?','<div class="briefstats"><span class="pill">3–5 minuten</span><span class="pill">Eigen streek</span><span class="pill">Stijl van een tv-programma</span></div>')+panel('<h3>Wie zit er aan de andere kant?</h3><p>Je opent een reportage over een skatepark. Lees beide versies en kies de opening voor een jeugdjournaal.</p><div class="two"><div class="tile"><span class="sectionNum">OPENING A</span><p>“Zou jij van deze helling durven rollen? De elfjarige Noor toont hoe je voor het eerst veilig beneden komt.”</p></div><div class="tile"><span class="sectionNum">OPENING B</span><p>“Wie langs het kanaal wandelt, kan hier even pauzeren en de skaters vanaf het terras bekijken.”</p></div></div>'+selectF('warmChoice','Welke opening kies je?',['Opening A','Opening B'])+field('warm','Welk woord of detail geeft de doorslag? Voor welk publiek werkt de andere opening?')+'<details><summary>Vergelijk je redenering</summary><p><strong>Opening A.</strong> De vraag aan de kijker en de jonge gids spreken een jeugdpubliek rechtstreeks aan. Opening B helpt een recreatieve bezoeker een uitstap te plannen.</p></details>')+panel('<h3>Je redactiedossier</h3><p>Je kunt tussen de onderdelen wisselen. Je antwoorden blijven op dit toestel in deze browser bewaard. Vul voor je pdf je naam en klas in.</p><div class="two">'+field('name','Naam','text')+field('class','Klas','text')+'</div><details><summary>Waar let je leerkracht op?</summary><p>Je beoordeelt je video straks op dezelfde elf criteria als je leerkracht. Bekijk de niveaubeschrijvingen bij Terugkijken.</p><ol>'+rubric.map(r=>'<li>'+r[0]+'</li>').join('')+'</ol></details><details><summary>Leerplandoelen en lesbronnen</summary>'+goals.map(g=>'<p><strong>LPD '+g[0]+' · '+g[1]+'.</strong> '+g[2]+'</p>').join('')+'<p>'+ext(sources[0],'Les 9 · Spreken over tv-reportages')+' · '+ext(sources[1],'Leerplan Nederlands III-Ned-da, juni 2024')+'</p></details>')}
function kijk(){return intro(1,'De kijkkamer','Haal de drie klassikaal bekeken reportages terug voor de geest. Gebruik de kijkkaart om zichtbaar en hoorbaar bewijs te verzamelen. Je kunt het fragment opnieuw openen of met je klasnotities werken.')+films.map((url,i)=>panel('<div class="split"><div><div class="sectionNum">KIJKKAART '+num(i+1)+'</div><h3>Reportage '+(i+1)+'</h3></div>'+ext(url,'Open het fragment')+'</div>'+field('title'+i,'Welke plek of titel herken je? (optioneel)','text')+'<h4>Vraag '+(2*i+1)+' · Wat herken je?</h4><p>Vink de kenmerken aan die je concreet kunt aanwijzen.</p><div class="gridcheck">'+features.map((r,j)=>checkbox('v'+i+'c'+j,r[0])).join('')+'</div>'+checkbox('none'+i,'Ik kan geen van deze kenmerken met zekerheid aanwijzen.')+'<h4>Vraag '+(2*i+2)+' · Beoordeel de aanpak</h4>'+field('minus'+i,'Welk element voldoet minder goed en waarom? Voldoet alles volgens jou, onderbouw dat oordeel dan.')+field('proof'+i,'Welk beeld, geluid of citaat ondersteunt jouw analyse? Beschrijf het effect op de kijker.') )).join('')}
const terms=[['Doelgroep','De kijkers voor wie je de reportage maakt.'],['Voice-over','Een stem geeft toelichting over beelden heen, zonder dat je de spreker op dat moment ziet spreken.'],['Camerastandpunt','De positie vanwaar de camera het onderwerp filmt.'],['Intonatie','Het verloop van de toonhoogte tijdens het spreken.'],['Ondertiteling','Tekst in beeld die gesproken taal en waar nodig belangrijke geluiden weergeeft.'],['Montage','Het selecteren, ordenen en verbinden van beeld en geluid tot een geheel.'],['Anekdote','Een kort verhaal over een concrete gebeurtenis.'],['Outro','De afsluiting waarin je de reportage afrondt.']];
function montage(){return intro(2,'De montagetafel','Onderzoek hoe een regiekeuze de boodschap verandert. Gebruik de voorbeelden bij het oefenen en later bij het plannen van je eigen opname.')+panel('<h3>Tien kenmerken in beeld</h3>'+['Voor wie vertel je?','Hoe bouw je je verhaal op?','Wat ziet en hoort de kijker?'].map(group=>'<details><summary>'+group+'</summary>'+features.filter(a=>a[1]===group).map(a=>'<div class="tile"><strong>'+a[0]+'</strong><p>'+a[2]+'</p><p class="subtle">'+a[3]+'</p></div>').join('')+'</details>').join('')+'<details><summary>Woordenboek van de redactie</summary><dl>'+terms.map(t=>'<dt><strong>'+t[0]+'</strong></dt><dd>'+t[1]+'</dd>').join('')+'</dl></details>')+['gap','match','regie'].map(quiz).join('')}
function redactie(){return intro(3,'De redactieproef','Lees hoe twee redacties dezelfde brug in beeld brengen. Houd bij elke keuze van de makers voor ogen wat hun kijker moet begrijpen of ervaren.')+panel('<div class="sectionNum">LEESTEKST · FICTIEVE REDACTIECASUS</div><article class="article"><h3>'+readingTitle+'</h3>'+article.map(p=>'<p>'+p+'</p>').join('')+'</article>')+quiz('read')}
function quiz(id){const t=data(id),z=quizzes[id];return '<section class="panel" id="quiz-'+id+'"><div class="sectionNum">OEFENING · '+z.items.length+' PUNTEN</div><h3>'+z.name+'</h3><p>'+z.inst+'</p>'+(id==='gap'?'<div class="chips">'+bank.map(x=>'<span>'+x+'</span>').join('')+'</div>':'')+z.items.map((q,i)=>{const val=t.draft[i],attrs=' data-test="'+id+'" data-idx="'+i+'" '+(t.locked?'disabled':'');let widget;if(z.mode==='radio')widget='<div>'+q.opts.map((v,j)=>'<label class="choice"><input type="radio" name="'+id+i+'" value="'+j+'" '+attrs+(String(val)===String(j)?' checked':'')+'><span>'+esc(v)+'</span></label>').join('')+'</div>';else if(z.mode==='gap')widget='<div><input aria-label="Antwoord op vraag '+(i+1)+'" type="text" autocomplete="off" '+attrs+' value="'+esc(val)+'"></div>';else widget='<div><select aria-label="Kenmerk voor situatie '+(i+1)+'" '+attrs+'><option value="">Kies het kenmerk</option>'+q.opts.map((v,j)=>'<option value="'+j+'" '+(String(val)===String(j)?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>';return '<fieldset class="q"><legend><span class="qid">'+num(i+1)+'</span>'+esc(q.p)+'</legend>'+widget+(t.locked?'<div class="feedback '+(correct(id,q,val)?'':'miss')+'"><strong>'+(correct(id,q,val)?'Juist.':'Juiste antwoord: '+esc(answer(id,q,q.a))+'.')+'</strong> '+esc(q.why)+'</div>':'')+'</fieldset>'}).join('')+'<div class="controls">'+(t.locked?btn('retry-'+id,'Opnieuw oefenen')+'<strong>Score '+t.last.score+' / '+z.items.length+'</strong>':btn('check-'+id,'Controleer mijn antwoorden','primary'))+'</div><p role="status" class="err" id="msg-'+id+'"></p></section>'}
function productie(){return intro(4,'Op reportage','Maak een reportage van drie tot vijf minuten over je eigen streek. Laat je inspireren door een bestaand programma, zoals Karrewiet, Reizen Waes of Vlaanderen Vakantieland. Bepaal wat jouw kijker aan het einde wil weten of doen.')+panel('<div class="sectionNum">VOORBEREIDING</div><h3>Je redactieplan</h3>'+openPlans.map(([k,l],i)=>field(k,l,i<3?'text':'textarea',2)).join(''))+panel('<div class="sectionNum">PLANNING</div><h3>Je draaiboek</h3><p>Verdeel je beschikbare tijd over de drie delen. Plan in elke rij wat de kijker hoort én wat je daarvoor moet filmen.</p>'+sceneNames.map((s,i)=>'<div class="scene"><strong>'+s+'</strong><div class="two">'+field('say'+i,'Wat hoort de kijker?','textarea',2)+field('see'+i,'Wat ziet de kijker?','textarea',2)+'</div>'+field('time'+i,'Geschatte duur (optioneel)','text')+'</div>').join(''))+panel('<div class="sectionNum">VRAAG 7</div><h3>Je presentatietekst</h3><p>Schrijf de tekst die je zelf gaat inspreken. Lees hem hardop met je beelden erbij en meet of je reportage binnen drie tot vijf minuten blijft.</p>'+field('script','Mijn volledige tekst','textarea',9)+'<div id="wc" class="micro"></div>')+panel('<h3>Opname, montage en toonmoment</h3>'+logistics.map(([k,l])=>field(k,l,'textarea',2)).join('')+'<p>Vink af na uitvoering. Stel tijdens het toonmoment kort je doelpubliek en voorbeeldprogramma voor.</p>'+shootChecks.map(([k,l])=>checkbox(k,l)).join(''))}
function scoreTable(){return '<div class="tablewrap"><table><thead><tr><th>Oefening</th><th>Eerste</th><th>Recentste</th><th>Pogingen</th></tr></thead><tbody>'+Object.keys(quizzes).map(id=>{const t=data(id),max=quizzes[id].items.length;return '<tr><td>'+quizzes[id].name+'</td><td>'+(t.first?t.first.score+' / '+max:'—')+'</td><td>'+(t.last?t.last.score+' / '+max:'—')+'</td><td>'+t.attempts+'</td></tr>'}).join('')+'</tbody></table></div><p><strong>Totaal recentste scores: '+metrics().total+' / 27.</strong> Een streepje betekent dat je de oefening nog moet indienen.</p>'}
function taskTable(){return '<ul>'+metrics().flat.map(([l,ok])=>'<li>'+esc(l)+' · '+(ok?'afgerond':'nog aan te vullen')+'</li>').join('')+'</ul>'}
function back(){return intro(5,'Terugkijken','Bekijk je eigen opname met de rubric erbij. Rond daarna de exitquiz af en bewaar je volledige redactiedossier.')+panel('<div class="sectionNum">VRAAG 8 · ZELFEVALUATIE</div><h3>Jouw reportage onder de loep</h3><p>Kies voor elk criterium het niveau dat past bij wat je ziet en hoort. Open de niveaubeschrijvingen als je twijfelt.</p>'+rubric.map((r,i)=>'<div class="rubrow">'+selectF('rub'+i,r[0],levels)+'<details><summary>Vergelijk de vijf niveaus</summary><ul>'+levels.map((l,j)=>'<li><b>'+l+'</b> · '+r[j+1]+'</li>').join('')+'</ul></details>'+(f('rub'+i)?'<p id="desc'+i+'" class="help">'+esc(r[levels.indexOf(f('rub'+i))+1])+'</p>':'<p id="desc'+i+'" class="help"></p>')+'</div>').join('')+field('improve','Welk concreet moment zou je opnieuw opnemen of monteren? Wat verander je en waarom?'))+quiz('exit')+panel('<div id="results"><div class="sectionNum">DOSSIER</div><h3>Je scorelijst</h3><div id="resultInner"></div><details><summary>Welke opdrachten zijn afgerond?</summary><div id="taskStatus"></div></details><div class="two">'+field('name','Naam op je dossier','text')+field('class','Klas op je dossier','text')+'</div><p>Exporteer je antwoorden, scores, kijkkaarten, draaiboek en rubric. Kies in het afdrukvenster <strong>Opslaan als pdf</strong>.</p>'+btn('print','Bewaar mijn redactiedossier als pdf','primary')+'</div>')}
const screens=[briefing,kijk,montage,redactie,productie,back];
function render(){const i=state.page;$('#main').innerHTML=screens[i]()+'<div class="nextbar">'+(i?'<button class="secondary" data-go="'+(i-1)+'">← Vorige</button>':'<span></span>')+(i<5?'<button class="primary" data-go="'+(i+1)+'">Verder naar '+stages[i+1].toLowerCase()+' →</button>':'')+'</div>';update();status()}
function go(i){state.page=i;persist();render();$('#main').focus({preventScroll:true});$('#main').scrollIntoView({block:'start'})}
function control(e){const el=e.target,k=el.dataset.f;if(k!==undefined){state.f[k]=el.type==='checkbox'?el.checked:el.value;const n=k.match(/^none(\d)$/),v=k.match(/^v(\d)c\d+$/);if(el.checked&&n){features.forEach((_,j)=>{const key='v'+n[1]+'c'+j;state.f[key]=false;document.querySelector('[data-f="'+key+'"]').checked=false})}if(el.checked&&v){state.f['none'+v[1]]=false;document.querySelector('[data-f="none'+v[1]+'"]').checked=false}const r=k.match(/^rub(\d+)$/);if(r)$('#desc'+r[1]).textContent=el.value?rubric[Number(r[1])][levels.indexOf(el.value)+1]:'';persist();update();return}
if(el.dataset.test){const t=data(el.dataset.test);if(!t.locked){t.draft[el.dataset.idx]=el.value;persist()}}}
document.addEventListener('input',control);
document.addEventListener('change',e=>{if(e.target.matches('select,input[type=checkbox],input[type=radio]'))control(e)});
function repaintQuiz(id){const section=$('#quiz-'+id);section.outerHTML=quiz(id);update();const heading=$('#quiz-'+id+' h3');heading.tabIndex=-1;heading.focus({preventScroll:true});heading.scrollIntoView({block:'start'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined){go(Number(b.dataset.go));return}if(b.id==='showScore'){go(5);$('#results').scrollIntoView();const h=$('#results h3');h.tabIndex=-1;h.focus({preventScroll:true});return}
const action=b.dataset.act||'';if(action==='print'){makeReport();window.print();return}
const [cmd,id]=action.split('-');if(!quizzes[id])return;const t=data(id),z=quizzes[id];if(cmd==='check'&&!t.locked){const missing=z.items.findIndex((_,j)=>String(t.draft[j]??'').trim()==='');if(missing>=0){$('#msg-'+id).textContent='Vul eerst vraag '+(missing+1)+' in.';$('#quiz-'+id+' [data-idx="'+missing+'"]').focus();return}const score=z.items.reduce((n,q,j)=>n+Number(correct(id,q,t.draft[j])),0);t.last={score,answers:{...t.draft}};if(!t.first)t.first={score,answers:{...t.draft}};t.locked=true;t.attempts++;persist();repaintQuiz(id)}else if(cmd==='retry'&&t.locked){t.locked=false;t.draft={};persist();repaintQuiz(id)}});

const reportItem=(l,val)=>'<div class="item"><strong>'+esc(l)+'</strong><p>'+esc(val||'Nog niet ingevuld')+'</p></div>';
function quizReport(id){const z=quizzes[id],t=data(id);return '<h3>'+z.name+'</h3>'+z.items.map((q,i)=>{const saved=t.last?.answers[i];let out='<div class="item"><strong>'+num(i+1)+'. '+esc(q.p)+'</strong>';if(q.opts)out+='<p>Opties: '+q.opts.map(esc).join(' / ')+'</p>';if(t.last){out+='<p>Recentste ingediende antwoord: '+esc(answer(id,q,saved))+'</p><p>Feedback: '+(correct(id,q,saved)?'juist':'onjuist')+'. Correct antwoord: '+esc(answer(id,q,q.a))+'. '+esc(q.why)+'</p>'}if(!t.locked)out+='<p>Huidige invulling: '+esc(answer(id,q,t.draft[i]))+' (nog niet ingediend)</p>';return out+'</div>'}).join('')}
function makeReport(){const m=metrics();$('#print').innerHTML='<h1>In beeld · Redactiedossier</h1><p>'+esc(f('name')||'Naam niet ingevuld')+' · '+esc(f('class')||'Klas niet ingevuld')+' · '+new Date().toLocaleDateString('nl-BE')+'</p><p>Afgerond: '+m.count+' van '+m.flat.length+' onderdelen ('+m.pct+'%).</p><h2>Scorelijst</h2>'+scoreTable()+'<h2>01 · De briefing</h2>'+reportItem('Opening voor een jeugdjournaal',f('warmChoice'))+reportItem('Mijn motivering en publiek voor de andere opening',f('warm'))+'<h2>02 · De kijkkamer</h2>'+films.map((url,i)=>'<h3>Reportage '+(i+1)+'</h3><p>'+esc(url)+'</p>'+reportItem('Herkenbare plek of titel',f('title'+i))+reportItem('Vraag '+(i*2+1)+' · Aanwezige checklistcriteria',f('none'+i)?'Geen kenmerk met zekerheid herkend':features.filter((_,j)=>f('v'+i+'c'+j)).map(r=>r[0]).join(', '))+reportItem('Vraag '+(i*2+2)+' · Welk element voldoet minder goed en waarom?',f('minus'+i))+reportItem('Mijn voorbeeld en het effect op de kijker',f('proof'+i))).join('')+'<h2>03 · De montagetafel</h2>'+['gap','match','regie'].map(quizReport).join('')+'<h2>04 · De redactieproef</h2><h3>'+readingTitle+'</h3>'+article.map(p=>'<p>'+esc(p)+'</p>').join('')+quizReport('read')+'<h2>05 · Op reportage</h2>'+openPlans.map(([k,l])=>reportItem(l,f(k))).join('')+sceneNames.map((s,i)=>'<h3>'+s+'</h3>'+reportItem('Wat hoort de kijker?',f('say'+i))+reportItem('Wat ziet de kijker?',f('see'+i))+reportItem('Geschatte duur',f('time'+i))).join('')+reportItem('Vraag 7 · Volledige presentatietekst',f('script'))+logistics.map(([k,l])=>reportItem(l,f(k))).join('')+shootChecks.map(([k,l])=>reportItem(l,f(k)?'Afgevinkt':'Nog niet afgevinkt')).join('')+'<h2>06 · Terugkijken</h2><h3>Vraag 8 · Zelfevaluatie</h3>'+rubric.map((r,i)=>{const l=f('rub'+i);return reportItem(r[0],l?l+' · '+r[levels.indexOf(l)+1]:'')}).join('')+reportItem('Mijn concrete verbetering',f('improve'))+quizReport('exit')}
window.addEventListener('beforeprint',makeReport);
function drawCamera(){const canvas=$('#camera'),box=canvas.parentElement,w=box.clientWidth,h=box.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);if(!w||!h)return;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');if(!c)return;c.scale(dpr,dpr);c.fillStyle='#1f3a41';c.fillRect(0,0,w,h);
function poly(points,fill,stroke,width=1){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function line(x,y,xx,yy,color,weight=1){c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.strokeStyle=color;c.lineWidth=weight;c.stroke()}
function circle(x,y,r,fill,stroke,weight=1){c.beginPath();c.arc(x,y,r,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=weight;c.stroke()}}
for(let x=0;x<w;x+=22)line(x,0,x,h,'#335057',.7);for(let y=0;y<h;y+=22)line(0,y,w,y,'#335057',.7);
const sc=Math.min(w/390,h/197);c.save();c.translate(w*.51,h*.49);c.scale(sc,sc);c.rotate(-.10);
circle(9,4,91,'#e7a276');circle(9,4,77,null,'#f4c098',1);circle(9,4,65,null,'#f4c098',1);
const dark='#142e35',cream='#e2e7ca',pale='#d0dbb7',trim='#516a68',coral='#ff895e';
poly([[-100,-30],[-77,-49],[29,-49],[51,-31],[50,34],[-77,46],[-101,31]],dark,cream,2);
poly([[-100,-30],[-77,-44],[30,-44],[12,-29]],pale,dark,2);
poly([[-101,-30],[13,-30],[13,44],[-100,44]],'#93ada1',dark,3);
poly([[-91,-19],[-15,-19],[-15,31],[-91,31]],'#223d42',dark,2);
for(let i=0;i<7;i++)line(-82,-9+i*4,-48,-9+i*4,trim,1.7);
circle(-28,14,6,coral,dark,2);circle(-28,-6,4,cream);
poly([[-125,-9],[-102,-16],[-101,15],[-125,12]],dark,cream,2);
poly([[-143,-15],[-124,-13],[-124,14],[-143,19]],'#839c91',dark,3);
poly([[-59,-53],[-53,-68],[-8,-68],[0,-53],[-7,-51],[-14,-60],[-47,-60],[-51,-51]],dark,cream,2);
poly([[19,-22],[55,-31],[91,-23],[91,28],[53,36],[18,29]],'#456461',dark,3);
for(let i=0;i<8;i++)line(34+i*5,-24,34+i*5,29,i%2?dark:'#94a79a',2);
poly([[76,-23],[112,-32],[120,-24],[120,31],[112,37],[76,27]],dark,cream,2);
c.beginPath();c.ellipse(116,2,10,31,0,0,Math.PI*2);c.fillStyle='#577777';c.fill();c.strokeStyle=dark;c.lineWidth=3;c.stroke();
poly([[-45,46],[-11,46],[-10,54],[-44,54]],dark,cream,1.5);
line(-29,54,-58,98,dark,7);line(-24,54,4,98,dark,7);line(-26,54,-36,98,cream,2);
c.restore();const pad=12,k=11;for(const [x,y,s,t] of [[pad,pad,1,1],[w-pad,pad,-1,1],[pad,h-pad,1,-1],[w-pad,h-pad,-1,-1]]){line(x,y,x+s*k,y,'#a3babb',1);line(x,y,x,y+t*k,'#a3babb',1)}circle(w-52,23,3.1,coral);c.fillStyle='#d8e3d9';c.font='10px Consolas, monospace';c.fillText('REC',w-44,26)}
render();drawCamera();window.addEventListener('resize',drawCamera);
</script></body></html>
